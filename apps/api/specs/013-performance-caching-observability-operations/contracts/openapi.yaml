            message: { $ref: '#/components/schemas/LocalizedMessage' }
            reason: { type: string, minLength: 10, maxLength: 500 }
    UpdateMaintenanceRequest:
      allOf:
        - { $ref: '#/components/schemas/VersionedReasonRequest' }
        - type: object
          properties:
            startsAt: { $ref: '#/components/schemas/Timestamp' }
            endsAt: { $ref: '#/components/schemas/Timestamp' }
            scopes: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: string } }
            message: { $ref: '#/components/schemas/LocalizedMessage' }
            status: { type: string, enum: [scheduled, active, completed, canceled] }
