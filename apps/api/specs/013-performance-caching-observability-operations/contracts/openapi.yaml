      type: object
      additionalProperties: false
      required: [p50, p95, p99, unit, status]
      properties:
        p50: { type: [number, 'null'], minimum: 0 }
        p95: { type: [number, 'null'], minimum: 0 }
        p99: { type: [number, 'null'], minimum: 0 }
        unit: { type: string, enum: [milliseconds, seconds, count, percent, bytes] }
        status: { type: string, enum: [within_budget, breached, unavailable, not_applicable] }
