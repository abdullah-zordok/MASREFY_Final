          properties:
            coreFinanceAvailable: { type: boolean, const: true }
            billingAvailable: { type: boolean, const: false }
            paidEntitlement: { type: boolean, const: false }
            checkoutAvailable: { type: boolean, const: false }
            subscriptionManagementAvailable: { type: boolean, const: false }
            promotionsAvailable: { type: boolean, const: false }
