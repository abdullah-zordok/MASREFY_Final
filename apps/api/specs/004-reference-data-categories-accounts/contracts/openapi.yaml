openapi: 3.1.0
info:
  title: Masarifi Reference Data, Categories & Accounts
  version: 0.4.0
servers:
  - url: /
security:
  - ClerkBearer: []
tags:
  - name: Reference
  - name: Categories
  - name: Accounts
  - name: Exchange Rates
  - name: Admin Reference
paths:
  /api/v1/reference/currencies:
    get:
      tags: [Reference]
      operationId: listCurrencies
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Enabled currencies
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrencyListResponse' }
        '304': { description: Unchanged }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/reference/countries:
    get:
      tags: [Reference]
      operationId: listCountries
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Enabled countries
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountryListResponse' }
        '304': { description: Unchanged }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/exchange-rates:
    get:
      tags: [Exchange Rates]
      operationId: getExchangeRate
      parameters:
        - { name: base, in: query, required: true, schema: { $ref: '#/components/schemas/CurrencyCode' } }
        - { name: quote, in: query, required: true, schema: { $ref: '#/components/schemas/CurrencyCode' } }
        - { name: at, in: query, schema: { type: string, format: date-time } }
        - { name: maxAgeSeconds, in: query, schema: { type: integer, minimum: 60, maximum: 31536000, default: 86400 } }
      responses:
        '200':
          description: Closest eligible approved rate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRateResponse' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/CategoryKind' } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UserLimit'
      responses:
        '200':
          description: System and owner categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPageResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Categories]
      operationId: createCategory
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/categories/{categoryId}:
    parameters: [{$ref: '#/components/parameters/CategoryId'}]
    patch:
      tags: [Categories]
      operationId: updateCategory
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Categories]
      operationId: archiveCategory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { description: Archived or already archived }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/categories/{categoryId}/restore:
    post:
      tags: [Categories]
      operationId: restoreCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/categories/{categoryId}/merge:
    post:
      tags: [Categories]
      operationId: mergeCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeCategoryRequest' }
      responses:
        '200': { description: Merged, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccountStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UserLimit'
      responses:
        '200': { description: Owner accounts, content: { application/json: { schema: { $ref: '#/components/schemas/AccountPageResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Accounts]
      operationId: createAccount
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201': { description: Created account, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAccountResponse' } } } }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/accounts/{accountId}:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    get:
      tags: [Accounts]
      operationId: getAccount
      responses:
        '200': { description: Owner account, content: { application/json: { schema: { $ref: '#/components/schemas/AccountResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AccountResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Accounts]
      operationId: archiveAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { description: Archived or already archived }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/accounts/{accountId}/restore:
    post:
      tags: [Accounts]
      operationId: restoreAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionRequest' } } } }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/AccountResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/accounts/{accountId}/close:
    post:
      tags: [Accounts]
      operationId: closeAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CloseAccountRequest' } } } }
      responses:
        '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/AccountResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/reference/currencies:
    get:
      tags: [Admin Reference]
      operationId: listAdminCurrencies
      x-permission: reference.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200': { description: Bounded currency page, content: { application/json: { schema: { $ref: '#/components/schemas/CurrencyPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/reference/currencies/{currencyCode}:
    patch:
      tags: [Admin Reference]
      operationId: updateAdminCurrency
      x-permission: reference.write
      x-recent-mfa: true
      parameters:
        - { name: currencyCode, in: path, required: true, schema: { $ref: '#/components/schemas/CurrencyCode' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCurrencyRequest' } } } }
      responses:
        '200': { description: Updated currency, content: { application/json: { schema: { $ref: '#/components/schemas/Currency' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/reference/countries:
    get:
      tags: [Admin Reference]
      operationId: listAdminCountries
      x-permission: reference.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200': { description: Bounded country page, content: { application/json: { schema: { $ref: '#/components/schemas/CountryPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/reference/countries/{countryCode}:
    patch:
      tags: [Admin Reference]
      operationId: updateAdminCountry
      x-permission: reference.write
      x-recent-mfa: true
      parameters:
        - { name: countryCode, in: path, required: true, schema: { $ref: '#/components/schemas/CountryCode' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCountryRequest' } } } }
      responses:
        '200': { description: Updated country, content: { application/json: { schema: { $ref: '#/components/schemas/Country' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/reference/categories:
    get:
      tags: [Admin Reference]
      operationId: listAdminSystemCategories
      x-permission: reference.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200': { description: Bounded system-category page, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryPageResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/reference/categories/{categoryId}:
    patch:
      tags: [Admin Reference]
      operationId: updateAdminSystemCategory
      x-permission: reference.write
      x-recent-mfa: true
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSystemCategoryRequest' } } } }
      responses:
        '200': { description: Updated system category, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/admin/reference/exchange-rates:
    get:
      tags: [Admin Reference]
      operationId: listAdminExchangeRates
      x-permission: reference.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AdminLimit'
      responses:
        '200': { description: Bounded exchange-rate page, content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeRatePage' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin Reference]
      operationId: createAdminExchangeRate
      x-permission: reference.write
      x-recent-mfa: true
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExchangeRateRequest' } } } }
      responses:
        '201': { description: Immutable approved metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ExchangeRateResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    ClerkBearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IfNoneMatch: { name: If-None-Match, in: header, schema: { type: string, maxLength: 128 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' } }
    ExpectedVersion: { name: expectedVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    UserLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    AdminLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Safe platform error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    CurrencyCode: { type: string, pattern: '^[A-Z]{3}$' }
    CountryCode: { type: string, pattern: '^[A-Z]{2}$' }
    CategoryKind: { type: string, enum: [income, expense, transfer] }
    AccountType: { type: string, enum: [bank, debit_card, credit_card, wallet, cash, savings, other] }
    AccountStatus: { type: string, enum: [active, archived, closed] }
    Currency:
      type: object
      additionalProperties: false
      required: [code, name, minorUnit, version]
      properties:
        code: { $ref: '#/components/schemas/CurrencyCode' }
        name: { type: string, maxLength: 100 }
        minorUnit: { type: integer, minimum: 0, maximum: 4 }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
    Country:
      type: object
      additionalProperties: false
      required: [code, name, defaultCurrency, version]
      properties:
        code: { $ref: '#/components/schemas/CountryCode' }
        name: { type: string, maxLength: 100 }
        defaultCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
    Category:
      type: object
      additionalProperties: false
      required: [id, scope, kind, labelAr, labelEn, sortOrder, active, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [system, custom] }
        kind: { $ref: '#/components/schemas/CategoryKind' }
        labelAr: { type: string, maxLength: 100 }
        labelEn: { type: string, maxLength: 100 }
        icon: { type: [string, 'null'], maxLength: 64 }
        color: { type: [string, 'null'], maxLength: 32 }
        systemKey: { type: [string, 'null'], maxLength: 64 }
        parentId: { type: [string, 'null'], format: uuid }
        mergedIntoId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer }
        active: { type: boolean }
        status: { type: string, enum: [active, archived, merged] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Account:
      type: object
      additionalProperties: false
      required: [id, name, type, currency, isDefault, status, sortOrder, includeInTotals, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        institutionName: { type: [string, 'null'], maxLength: 100 }
        lastFour: { type: [string, 'null'], pattern: '^\d{4}$' }
        creditLimitMinor: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        isDefault: { type: boolean }
        iconKey: { type: [string, 'null'], maxLength: 64 }
        colorKey: { type: [string, 'null'], maxLength: 32 }
        notes: { type: [string, 'null'], maxLength: 500 }
        status: { $ref: '#/components/schemas/AccountStatus' }
        sortOrder: { type: integer }
        includeInTotals: { type: boolean }
        openedAt: { type: [string, 'null'], format: date }
        closedAt: { type: [string, 'null'], format: date }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExchangeRate:
      type: object
      additionalProperties: false
      required: [base, quote, rate, effectiveAt, provider]
      properties:
        id: { type: [string, 'null'], format: uuid }
        base: { $ref: '#/components/schemas/CurrencyCode' }
        quote: { $ref: '#/components/schemas/CurrencyCode' }
        rate: { type: number, exclusiveMinimum: 0 }
        effectiveAt: { type: string, format: date-time }
        provider: { type: string, maxLength: 64 }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [labelAr, labelEn]
      properties:
        kind: { $ref: '#/components/schemas/CategoryKind' }
        labelAr: { type: string, minLength: 1, maxLength: 100 }
        labelEn: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: [string, 'null'], maxLength: 64 }
        color: { type: [string, 'null'], maxLength: 32 }
        parentId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/CategoryKind' }
        labelAr: { type: string, minLength: 1, maxLength: 100 }
        labelEn: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: [string, 'null'], maxLength: 64 }
        color: { type: [string, 'null'], maxLength: 32 }
        parentId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }
    MergeCategoryRequest:
      type: object
      additionalProperties: false
      required: [targetId, expectedVersion]
      properties:
        targetId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, type, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        institutionName: { type: [string, 'null'], maxLength: 100 }
        lastFour: { type: [string, 'null'], pattern: '^\d{4}$' }
        creditLimitMinor: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        isDefault: { type: boolean, default: false }
        iconKey: { type: [string, 'null'], maxLength: 64 }
        colorKey: { type: [string, 'null'], maxLength: 32 }
        notes: { type: [string, 'null'], maxLength: 500 }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
        includeInTotals: { type: boolean, default: true }
        openedAt: { type: [string, 'null'], format: date }
        openingBalanceMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991, default: 0 }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        institutionName: { type: [string, 'null'], maxLength: 100 }
        lastFour: { type: [string, 'null'], pattern: '^\d{4}$' }
        creditLimitMinor: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        isDefault: { type: boolean }
        iconKey: { type: [string, 'null'], maxLength: 64 }
        colorKey: { type: [string, 'null'], maxLength: 32 }
        notes: { type: [string, 'null'], maxLength: 500 }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
        includeInTotals: { type: boolean }
        openedAt: { type: [string, 'null'], format: date }
    CloseAccountRequest:
      type: object
      additionalProperties: false
      required: [closedAt, expectedVersion]
      properties:
        closedAt: { type: string, format: date }
        expectedVersion: { type: integer, minimum: 1 }
    CreateExchangeRateRequest:
      type: object
      additionalProperties: false
      required: [base, quote, rate, effectiveAt, reason]
      properties:
        base: { $ref: '#/components/schemas/CurrencyCode' }
        quote: { $ref: '#/components/schemas/CurrencyCode' }
        rate: { type: string, pattern: '^\d+(\.\d{1,12})?$' }
        effectiveAt: { type: string, format: date-time }
        providerRef: { type: [string, 'null'], maxLength: 200 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    UpdateCurrencyRequest:
      type: object
      additionalProperties: false
      required: [enabled, reason, expectedVersion]
      properties:
        enabled: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 100 }
        minorUnit: { type: integer, minimum: 0, maximum: 4 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    UpdateCountryRequest:
      type: object
      additionalProperties: false
      required: [enabled, reason, expectedVersion]
      properties:
        enabled: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 100 }
        defaultCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        reason: { type: string, minLength: 10, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    UpdateSystemCategoryRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      minProperties: 3
      properties:
        labelAr: { type: string, minLength: 1, maxLength: 100 }
        labelEn: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: [string, 'null'], maxLength: 64 }
        color: { type: [string, 'null'], maxLength: 32 }
        sortOrder: { type: integer, minimum: -100000, maximum: 100000 }
        active: { type: boolean }
        reason: { type: string, minLength: 10, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
    CurrencyListResponse:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/Currency' }
    CountryListResponse:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/Country' }
    CategoryResponse:
      $ref: '#/components/schemas/Category'
    CategoryPageResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Category' } }, nextCursor: { type: [string, 'null'] } }
    AccountResponse:
      $ref: '#/components/schemas/Account'
    CreateAccountResponse:
      type: object
      additionalProperties: false
      required: [account]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        openingTransactionId: { type: [string, 'null'], format: uuid }
    AccountPageResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties: { items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Account' } }, nextCursor: { type: [string, 'null'] } }
    ExchangeRateResponse:
      $ref: '#/components/schemas/ExchangeRate'
    CurrencyPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Currency' } }, nextCursor: { type: [string, 'null'] } }
    CountryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
