openapi: 3.1.0
info:
  title: Masarifi Tracking, Imports, Parsers and Deduplication API
  version: 0.8.0
  description: SPEC-BE-008 owner and Admin contracts. Raw payloads are never returned.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/tracking/preferences:
    get:
      operationId: getTrackingPreferences
      tags: [Tracking]
      responses:
        '200': { $ref: '#/components/responses/TrackingResource' }
        '401': { $ref: '#/components/responses/TrackingUnauthorized' }
    put:
      operationId: updateTrackingPreferences
      tags: [Tracking]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, reviewRequired, expectedVersion]
              properties:
                enabled: { type: boolean }
                reviewRequired: { type: boolean }
                rawRetentionDays: { type: integer, minimum: 0, maximum: 30 }
                historyRetentionDays: { type: integer, minimum: 30, maximum: 730 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/TrackingResource' }
        '400': { $ref: '#/components/responses/TrackingBadRequest' }
        '401': { $ref: '#/components/responses/TrackingUnauthorized' }
        '409': { $ref: '#/components/responses/TrackingConflict' }
  /api/v1/tracking/status:
    get:
      operationId: getTrackingStatus
      tags: [Tracking]
      responses:
        '200': { $ref: '#/components/responses/TrackingResource' }
  /api/v1/tracking/keyword-rules:
    get:
      operationId: listKeywordRules
      tags: [Tracking Rules]
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: createKeywordRule
      tags: [Tracking Rules]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/KeywordRuleMutation' }
      responses:
        '201': { $ref: '#/components/responses/TrackingResource' }
        '409': { $ref: '#/components/responses/TrackingConflict' }
  /api/v1/tracking/keyword-rules/{ruleId}:
    parameters: [{ $ref: '#/components/parameters/RuleId' }]
    patch:
      operationId: updateKeywordRule
      tags: [Tracking Rules]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/KeywordRuleMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
    delete:
      operationId: deleteKeywordRule
      tags: [Tracking Rules]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses: { '204': { description: Rule deleted. } }
  /api/v1/tracking/keyword-rules/restore-defaults:
    post:
      operationId: restoreDefaultKeywordRules
      tags: [Tracking Rules]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/tracking/sender-rules:
    get:
      operationId: listSenderRules
      tags: [Tracking Rules]
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: createSenderRule
      tags: [Tracking Rules]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/SenderRuleMutation' }
      responses: { '201': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/tracking/sender-rules/{ruleId}:
    parameters: [{ $ref: '#/components/parameters/RuleId' }]
    patch:
      operationId: updateSenderRule
      tags: [Tracking Rules]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/SenderRuleMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
    delete:
      operationId: deleteSenderRule
      tags: [Tracking Rules]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      responses: { '204': { description: Rule deleted. } }
  /api/v1/imports:
    get:
      operationId: listImportSessions
      tags: [Imports]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/SourceType'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: createImport
      tags: [Imports]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingNormalizedImportRequest' }
          text/csv:
            schema: { type: string, contentMediaType: text/csv, maxLength: 6291456 }
      responses:
        '202': { $ref: '#/components/responses/TrackingResource' }
        '400': { $ref: '#/components/responses/TrackingBadRequest' }
        '409': { $ref: '#/components/responses/TrackingConflict' }
        '413': { $ref: '#/components/responses/TrackingPayloadTooLarge' }
        '415': { $ref: '#/components/responses/TrackingUnsupported' }
  /api/v1/imports/{sessionId}:
    get:
      operationId: getImportSession
      tags: [Imports]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { $ref: '#/components/responses/TrackingResource' }
        '404': { $ref: '#/components/responses/TrackingNotFound' }
  /api/v1/imports/{sessionId}/items:
    get:
      operationId: listImportItems
      tags: [Imports]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/imports/{sessionId}/items/{itemId}:
    get:
      operationId: getImportItem
      tags: [Imports]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200': { $ref: '#/components/responses/TrackingResource' }
        '404': { $ref: '#/components/responses/TrackingNotFound' }
  /api/v1/reviews:
    get:
      operationId: listTrackingReviews
      tags: [Review]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/reviews/{reviewId}:
    get:
      operationId: getTrackingReview
      tags: [Review]
      parameters: [{ $ref: '#/components/parameters/ReviewId' }]
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/reviews/{reviewId}/decision:
    post:
      operationId: decideTrackingReview
      tags: [Review]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReviewDecision' }
      responses:
        '200': { $ref: '#/components/responses/TrackingResource' }
        '409': { $ref: '#/components/responses/TrackingConflict' }
  /api/v1/duplicates:
    get:
      operationId: listDuplicateCandidates
      tags: [Duplicates]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/MinScore'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/duplicates/{candidateId}:
    get:
      operationId: getDuplicateCandidate
      tags: [Duplicates]
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/duplicates/{candidateId}/decision:
    post:
      operationId: decideDuplicateCandidate
      tags: [Duplicates]
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/DuplicateDecision' }
      responses:
        '200': { $ref: '#/components/responses/TrackingResource' }
        '409': { $ref: '#/components/responses/TrackingConflict' }
  /api/v1/tracking/history:
    get:
      operationId: listTrackingHistory
      tags: [Tracking]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Outcome'
        - $ref: '#/components/parameters/SourceType'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    delete:
      operationId: clearTrackingHistory
      tags: [Tracking]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '204': { description: Eligible nonfinancial history detail compacted. } }
  /api/v1/tracking/feedback:
    post:
      operationId: createTrackingFeedback
      tags: [Tracking]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [historyId, kind]
              properties:
                historyId: { $ref: '#/components/schemas/TrackingUuid' }
                kind:
                  {
                    type: string,
                    enum:
                      [wrong_detection, wrong_category, wrong_merchant, duplicate_missed, other],
                  }
                correctedCategoryId: { $ref: '#/components/schemas/TrackingUuid' }
                comment: { type: string, minLength: 1, maxLength: 500 }
      responses: { '201': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/imports/overview:
    get:
      operationId: getAdminImportsOverview
      tags: [Admin Imports]
      x-admin-permission: imports.read
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/imports/sessions:
    get:
      operationId: listAdminImportSessions
      tags: [Admin Imports]
      x-admin-permission: imports.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/SourceType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/admin/imports/sessions/{sessionId}:
    get:
      operationId: getAdminImportSession
      tags: [Admin Imports]
      x-admin-permission: imports.detail.read
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AccessPurpose'
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/imports/sessions/{sessionId}/retry-handoff:
    post:
      operationId: retryAdminImportSession
      tags: [Admin Imports]
      x-admin-permission: imports.failures.manage
      x-requires-recent-mfa: true
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '202': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/imports/failures:
    get:
      operationId: listAdminImportFailures
      tags: [Admin Imports]
      x-admin-permission: imports.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/admin/imports/failures/{itemId}/action:
    post:
      operationId: actOnAdminImportFailure
      tags: [Admin Imports]
      x-admin-permission: imports.failures.manage
      x-requires-recent-mfa: true
      parameters:
        [
          { $ref: '#/components/parameters/ItemId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/imports/low-confidence:
    get:
      operationId: listAdminLowConfidence
      tags: [Admin Imports]
      x-admin-permission: imports.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/InstitutionFilter'
        - $ref: '#/components/parameters/ParserVersionFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/admin/imports/low-confidence/{reviewId}/review:
    post:
      operationId: reviewAdminLowConfidence
      tags: [Admin Imports]
      x-admin-permission: imports.confidence.manage
      x-requires-recent-mfa: true
      parameters:
        [
          { $ref: '#/components/parameters/ReviewId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/imports/duplicates:
    get:
      operationId: listAdminDuplicates
      tags: [Admin Imports]
      x-admin-permission: imports.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/admin/imports/duplicates/{candidateId}/resolve:
    post:
      operationId: resolveAdminDuplicate
      tags: [Admin Imports]
      x-admin-permission: imports.duplicates.manage
      x-requires-recent-mfa: true
      parameters:
        [
          { $ref: '#/components/parameters/CandidateId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/imports/unsupported-formats:
    get:
      operationId: listAdminUnsupportedFormats
      tags: [Admin Imports]
      x-admin-permission: imports.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/admin/imports/unsupported-formats/{formatId}/action:
    post:
      operationId: actOnUnsupportedFormat
      tags: [Admin Imports]
      x-admin-permission: imports.unsupported.manage
      x-requires-recent-mfa: true
      parameters:
        - name: formatId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TrackingUuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/institutions:
    get:
      operationId: listParserInstitutions
      tags: [Admin Parsers]
      x-admin-permission: parsers.coverage.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: createParserInstitution
      tags: [Admin Parsers]
      x-admin-permission: parsers.senders.manage
      x-requires-recent-mfa: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/AdminCreate' }
      responses: { '201': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/institutions/{institutionId}:
    get:
      operationId: getParserInstitution
      tags: [Admin Parsers]
      x-admin-permission: parsers.coverage.read
      parameters: [{ $ref: '#/components/parameters/InstitutionId' }]
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
    patch:
      operationId: updateParserInstitution
      tags: [Admin Parsers]
      x-admin-permission: parsers.senders.manage
      x-requires-recent-mfa: true
      parameters:
        [
          { $ref: '#/components/parameters/InstitutionId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/senders:
    get:
      operationId: listInstitutionSenders
      tags: [Admin Parsers]
      x-admin-permission: parsers.coverage.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/InstitutionFilter'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: createParserSender
      tags: [Admin Parsers]
      x-admin-permission: parsers.senders.manage
      x-requires-recent-mfa: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/AdminCreate' }
      responses: { '201': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/senders/{senderId}/action:
    post:
      operationId: mutateInstitutionSender
      tags: [Admin Parsers]
      x-admin-permission: parsers.senders.manage
      x-requires-recent-mfa: true
      parameters:
        - name: senderId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TrackingUuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/rules:
    get:
      operationId: listParserRules
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/SourceType'
        - $ref: '#/components/parameters/InstitutionFilter'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: createParserRule
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.manage
      x-requires-recent-mfa: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/AdminCreate' }
      responses: { '201': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/rules/{ruleId}:
    get:
      operationId: getParserRule
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.read
      parameters: [{ $ref: '#/components/parameters/RuleId' }]
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
    patch:
      operationId: updateParserRule
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.manage
      x-requires-recent-mfa: true
      parameters:
        [
          { $ref: '#/components/parameters/RuleId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/rules/{ruleId}/test-preview:
    post:
      operationId: previewParserRule
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.manage
      parameters: [{ $ref: '#/components/parameters/RuleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sample]
              properties: { sample: { type: string, minLength: 1, maxLength: 2000 } }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/test-cases:
    get:
      operationId: listParserTestCases
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/InstitutionFilter'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: createParserTestCase
      tags: [Admin Parsers]
      x-admin-permission: parsers.versions.manage
      x-requires-recent-mfa: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/AdminCreate' }
      responses: { '201': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/test-cases/run:
    post:
      operationId: runParserCorpus
      tags: [Admin Parsers]
      x-admin-permission: parsers.tests.run
      x-requires-recent-mfa: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '202': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/versions:
    get:
      operationId: listParserVersions
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/InstitutionFilter'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
  /api/v1/admin/parsers/versions/{versionId}/action:
    post:
      operationId: mutateParserVersion
      tags: [Admin Parsers]
      x-admin-permission: parsers.versions.manage
      x-requires-recent-mfa: true
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TrackingUuid' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/merchant-rules:
    get:
      operationId: listMerchantRules
      tags: [Admin Parsers]
      x-admin-permission: parsers.rules.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses: { '200': { $ref: '#/components/responses/TrackingPage' } }
    post:
      operationId: mutateMerchantRule
      tags: [Admin Parsers]
      x-admin-permission: parsers.merchants.manage
      x-requires-recent-mfa: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/AdminMutation' }
      responses: { '200': { $ref: '#/components/responses/TrackingResource' } }
  /api/v1/admin/parsers/category-rules:
    get:
