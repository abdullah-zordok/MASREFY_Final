components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Search:
      name: search
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    Status:
      name: status
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 32 }
    SourceType:
      name: sourceType
      in: query
      required: false
      schema: { type: string, enum: [sms, file, manual, provider] }
    Outcome:
      name: outcome
      in: query
      required: false
      schema:
        type: string
        enum: [received, parsed, reviewed, accepted, rejected, duplicate, failed, purged, feedback]
    MinScore:
      name: minScore
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 10000 }
    InstitutionFilter:
      name: institutionId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/TrackingUuid' }
    ParserVersionFilter:
      name: parserVersionId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/TrackingUuid' }
    From:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
    AccessPurpose:
      name: X-Access-Purpose
      in: header
      required: true
      schema: { type: string, minLength: 10, maxLength: 500 }
    RuleId:
      {
        name: ruleId,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/TrackingUuid' },
      }
    SessionId:
      {
        name: sessionId,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/TrackingUuid' },
      }
    ItemId:
      {
        name: itemId,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/TrackingUuid' },
      }
    ReviewId:
      {
        name: reviewId,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/TrackingUuid' },
      }
    CandidateId:
      {
        name: candidateId,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/TrackingUuid' },
      }
    InstitutionId:
      {
        name: institutionId,
        in: path,
        required: true,
        schema: { $ref: '#/components/schemas/TrackingUuid' },
      }
  requestBodies:
    AdminCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason, value]
            properties:
              reason: { type: string, minLength: 10, maxLength: 500 }
              value: { type: object, minProperties: 1, maxProperties: 12 }
    KeywordRuleMutation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [value, group, language, enabled]
            properties:
              value: { type: string, minLength: 1, maxLength: 120 }
              group: { type: string, minLength: 1, maxLength: 40 }
              language: { type: string, enum: [ar, en] }
              matchType: { type: string, enum: [exact, contains, safe_pattern] }
              categoryId:
                anyOf:
                  - { $ref: '#/components/schemas/TrackingUuid' }
                  - { type: 'null' }
              priority: { type: integer, minimum: 0, maximum: 10000 }
              enabled: { type: boolean }
              expectedVersion: { type: integer, minimum: 1 }
    SenderRuleMutation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [value, displayLabel]
            properties:
              value: { type: string, minLength: 1, maxLength: 256 }
              displayLabel: { type: string, minLength: 1, maxLength: 120 }
              institutionId:
                anyOf:
                  - { $ref: '#/components/schemas/TrackingUuid' }
                  - { type: 'null' }
              trusted: { type: boolean }
              enabled: { type: boolean }
              expectedVersion: { type: integer, minimum: 1 }
    ReviewDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [decision, expectedVersion]
            properties:
              decision: { type: string, enum: [accept, reject, edit_accept] }
              expectedVersion: { type: integer, minimum: 1 }
              edit:
                type: object
                additionalProperties: false
                properties:
                  amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
                  accountId: { $ref: '#/components/schemas/TrackingUuid' }
                  categoryId:
                    anyOf:
                      - { $ref: '#/components/schemas/TrackingUuid' }
                      - { type: 'null' }
                  title: { type: string, minLength: 1, maxLength: 160 }
                  merchant: { type: [string, 'null'], minLength: 1, maxLength: 160 }
                  paymentMethod: { type: [string, 'null'], minLength: 1, maxLength: 80 }
                  note: { type: [string, 'null'], minLength: 1, maxLength: 500 }
                  occurredAt: { type: string, format: date-time }
    DuplicateDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [resolution, expectedVersion]
            properties:
              resolution:
                { type: string, enum: [keep_existing, keep_new, keep_both, merge_details] }
              expectedVersion: { type: integer, minimum: 1 }
              merge:
                type: object
                additionalProperties: false
                properties:
                  title: { type: string, minLength: 1, maxLength: 200 }
                  merchant: { type: string, maxLength: 200 }
                  categoryId: { $ref: '#/components/schemas/TrackingUuid' }
                  occurredAt: { type: string, format: date-time }
    AdminMutation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [action, reason, expectedVersion]
            properties:
              action: { type: string, minLength: 1, maxLength: 64 }
              reason: { type: string, minLength: 10, maxLength: 500 }
              expectedVersion: { type: integer, minimum: 1 }
              patch: { type: object, maxProperties: 12 }
  schemas:
    TrackingUuid: { type: string, format: uuid }
    TrackingNormalizedImportRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceType, events]
      properties:
        schemaVersion: { type: integer, const: 1 }
        sourceType: { type: string, enum: [sms, manual] }
        sourceChannel:
          {
            type: string,
            enum:
              [
                android_sms,
                android_notification,
                ios_shortcut,
                ios_app_intent,
                ios_share_extension,
                manual,
              ],
          }
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [sourceItemKey, receivedAt]
            properties:
              sourceItemKey: { type: string, minLength: 1, maxLength: 200 }
              sender: { type: string, maxLength: 200 }
              body: { type: string, minLength: 1, maxLength: 2000 }
              amountMinor: { type: integer, minimum: -9007199254740991, maximum: 9007199254740991 }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              merchant: { type: string, minLength: 1, maxLength: 200 }
              receivedAt: { type: string, format: date-time }
              occurredAt: { type: string, format: date-time }
              metadata:
                type: object
                maxProperties: 12
                additionalProperties: { type: [string, number, boolean, 'null'] }
    TrackingResourceEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { $ref: '#/components/schemas/TrackingPhase08Resource' } }
    TrackingMutationEnvelope:
      type: object
      additionalProperties: false
      required: [operationId, replayed, resource, requestId, occurredAt]
      properties:
        operationId: { $ref: '#/components/schemas/TrackingUuid' }
        replayed: { type: boolean }
        resource: { $ref: '#/components/schemas/TrackingPhase08Resource' }
        requestId: { type: string, minLength: 1, maxLength: 200 }
        occurredAt: { type: string, format: date-time }
    TrackingPageEnvelope:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          {
            type: array,
            maxItems: 100,
            items: { $ref: '#/components/schemas/TrackingPhase08Resource' },
          }
        nextCursor: { type: [string, 'null'], maxLength: 512 }
    TrackingErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    TrackingPreferenceResource:
      type: object
      additionalProperties: false
      required: [id, enabled, reviewRequired, duplicateWindowSeconds, sourceRetentionDays, historyRetentionDays, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        enabled: { type: boolean }
        reviewRequired: { type: boolean }
        duplicateWindowSeconds: { type: integer, minimum: 60, maximum: 2592000 }
        sourceRetentionDays: { type: integer, minimum: 1, maximum: 365 }
        historyRetentionDays: { type: integer, minimum: 30, maximum: 730 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TrackingStatusResource:
      type: object
      additionalProperties: false
      required: [available, mode, lastDetectedAt, lastSuccessfulTransactionId, detectedThisMonth, reviewCount, activeKeywordCount, activeSenderCount, lastUpdatedAt]
      properties:
        available: { type: boolean }
        mode: { type: string, enum: [automatic_clear, review_all, paused] }
        lastDetectedAt: { type: [string, 'null'], format: date-time }
        lastSuccessfulTransactionId: { type: [string, 'null'], format: uuid }
        detectedThisMonth: { type: integer, minimum: 0 }
        reviewCount: { type: integer, minimum: 0 }
        activeKeywordCount: { type: integer, minimum: 0 }
        activeSenderCount: { type: integer, minimum: 0 }
        lastUpdatedAt: { type: string, format: date-time }
    TrackingKeywordRuleResource:
      type: object
      additionalProperties: false
      required: [id, keyword, groupKey, languageCode, origin, matchType, categoryId, priority, enabled, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        keyword: { type: string, minLength: 1, maxLength: 120 }
        groupKey: { type: string, enum: [expense, income, transfer, withdrawal, deposit, refund, subscription, installment, fee, failed_transaction, reversal] }
        languageCode: { type: string, enum: [ar, en] }
        origin: { type: string, enum: [default, custom] }
        matchType: { type: string, enum: [exact, contains, safe_pattern] }
        categoryId: { type: [string, 'null'], format: uuid }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TrackingSenderRuleResource:
      type: object
      additionalProperties: false
      required: [id, senderPattern, displayLabel, institutionId, trusted, enabled, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        senderPattern: { type: string, minLength: 1, maxLength: 256 }
        displayLabel: { type: string, minLength: 1, maxLength: 120 }
        institutionId: { type: [string, 'null'], format: uuid }
        trusted: { type: boolean }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TrackingReviewResource:
      type: object
      additionalProperties: false
      required: [id, importItemId, reason, proposedValues, originalValues, acceptedValues, status, decisionAction, reviewedAt, reviewedBy, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        importItemId: { $ref: '#/components/schemas/TrackingUuid' }
        reason: { type: string, pattern: '^[a-z][a-z0-9_]{1,79}$' }
        proposedValues: { type: object, maxProperties: 20 }
        originalValues: { type: object, maxProperties: 20 }
        acceptedValues: { type: [object, 'null'], maxProperties: 20 }
        status: { type: string, enum: [pending, accepted, rejected, edited] }
        decisionAction: { type: [string, 'null'], enum: [accept, reject, edit_accept, null] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [string, 'null'], maxLength: 128 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TrackingImportSessionResource:
      type: object
      additionalProperties: false
      required: [id, sourceType, sourceName, schemaVersion, status, itemCount, acceptedCount, rejectedCount, attemptCount, nextAttemptAt, startedAt, completedAt, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        sourceType: { type: string, enum: [sms, file, manual, provider] }
        sourceName: { type: [string, 'null'], maxLength: 120 }
        schemaVersion: { const: 1 }
        status: { type: string, enum: [received, processing, review, complete, failed, cancelled] }
        itemCount: { type: integer, minimum: 0, maximum: 10000 }
        acceptedCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        attemptCount: { type: integer, minimum: 0, maximum: 20 }
        nextAttemptAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TrackingAdminImportOverviewResource:
      type: object
      additionalProperties: false
      required: [totalSessions, uniqueCustomers, totalItems, failedSessions, reviewSessions, highestFailureSource]
      properties:
        totalSessions: { type: integer, minimum: 0 }
        uniqueCustomers: { type: integer, minimum: 0 }
        totalItems: { type: integer, minimum: 0 }
        failedSessions: { type: integer, minimum: 0 }
        reviewSessions: { type: integer, minimum: 0 }
        highestFailureSource: { type: string, enum: [sms, file, manual, provider] }
    TrackingParserInstitutionResource:
      type: object
      additionalProperties: false
      required: [id, countryCode, name, code, active, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, pattern: '^[a-z][a-z0-9-]{1,39}$' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TrackingParserRuleResource:
      type: object
      additionalProperties: false
      required: [id, institutionId, name, sourceType, activeVersionId, status, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        institutionId: { type: [string, 'null'], format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        sourceType: { type: string, enum: [sms, file, manual, provider] }
        activeVersionId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [draft, active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TrackingParserVersionResource:
      type: object
      additionalProperties: false
      required: [id, parserRuleId, versionNo, definitionHash, createdBy, publishedAt, corpusStatus, corpusRequestedAt, corpusAttemptCount, corpusNextAttemptAt, corpusLastErrorCode, createdAt]
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        parserRuleId: { $ref: '#/components/schemas/TrackingUuid' }
        versionNo: { type: integer, minimum: 1 }
        definitionHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdBy: { type: string, minLength: 1, maxLength: 128 }
        publishedAt: { type: [string, 'null'], format: date-time }
        corpusStatus: { type: string, enum: [not_run, queued, running, passed, failed] }
        corpusRequestedAt: { type: [string, 'null'], format: date-time }
        corpusAttemptCount: { type: integer, minimum: 0, maximum: 5 }
        corpusNextAttemptAt: { type: string, format: date-time }
        corpusLastErrorCode: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
        createdAt: { type: string, format: date-time }
    TrackingPhase08Resource:
      anyOf:
        - { $ref: '#/components/schemas/TrackingPreferenceResource' }
        - { $ref: '#/components/schemas/TrackingStatusResource' }
        - { $ref: '#/components/schemas/TrackingKeywordRuleResource' }
        - { $ref: '#/components/schemas/TrackingSenderRuleResource' }
        - { $ref: '#/components/schemas/TrackingReviewResource' }
        - { $ref: '#/components/schemas/TrackingImportSessionResource' }
        - { $ref: '#/components/schemas/TrackingAdminImportOverviewResource' }
        - { $ref: '#/components/schemas/TrackingParserInstitutionResource' }
        - { $ref: '#/components/schemas/TrackingParserRuleResource' }
        - { $ref: '#/components/schemas/TrackingParserVersionResource' }
        - { $ref: '#/components/schemas/TrackingGenericResource' }
    TrackingGenericResource:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        id: { $ref: '#/components/schemas/TrackingUuid' }
        kind: { type: string, maxLength: 64 }
        key: { type: string, maxLength: 120 }
        name: { type: string, maxLength: 200 }
        displayLabel: { type: string, maxLength: 200 }
        status: { type: string, maxLength: 64 }
        action: { type: string, maxLength: 64 }
        resolution: { type: [string, 'null'], maxLength: 64 }
        reasonCode: { type: [string, 'null'], maxLength: 64 }
        reasonCodes: { type: array, maxItems: 12, items: { type: string, maxLength: 64 } }
        enabled: { type: boolean }
        reviewRequired: { type: boolean }
        trusted: { type: boolean }
        version: { type: integer, minimum: 1 }
        sourceType: { type: string, maxLength: 32 }
        sessionId: { $ref: '#/components/schemas/TrackingUuid' }
        itemId: { $ref: '#/components/schemas/TrackingUuid' }
        transactionId: { type: [string, 'null'], format: uuid }
        existingTransactionId: { type: [string, 'null'], format: uuid }
        parserVersionId: { type: [string, 'null'], format: uuid }
        confidenceBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        scoreBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        itemCount: { type: integer, minimum: 0 }
        acceptedCount: { type: integer, minimum: 0 }
        rejectedCount: { type: integer, minimum: 0 }
        failedCount: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
  responses:
    TrackingResource:
      description: Owner- or permission-scoped resource with no raw payload.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/TrackingPhase08Resource'
              - $ref: '#/components/schemas/TrackingMutationEnvelope'
    TrackingPage:
      description: Cursor-paginated bounded resource list.
      content:
        { application/json: { schema: { $ref: '#/components/schemas/TrackingPageEnvelope' } } }
    TrackingBadRequest:
      description: Invalid or hostile input.
      content:
        { application/json: { schema: { $ref: '#/components/schemas/TrackingErrorEnvelope' } } }
    TrackingUnauthorized:
      description: Authentication required.
      content:
        { application/json: { schema: { $ref: '#/components/schemas/TrackingErrorEnvelope' } } }
    TrackingNotFound:
      description: Resource absent or outside the caller ownership boundary.
      content:
        { application/json: { schema: { $ref: '#/components/schemas/TrackingErrorEnvelope' } } }
    TrackingConflict:
      description: Expected-version or idempotency conflict.
      content:
        { application/json: { schema: { $ref: '#/components/schemas/TrackingErrorEnvelope' } } }
    TrackingPayloadTooLarge:
      description: Bounded payload limit exceeded.
      content:
        { application/json: { schema: { $ref: '#/components/schemas/TrackingErrorEnvelope' } } }
    TrackingUnsupported:
      description: Media type or format is not supported by Phase 08.
      content:
        { application/json: { schema: { $ref: '#/components/schemas/TrackingErrorEnvelope' } } }
