        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/DeletionStatus' }
        requestedAt: { $ref: '#/components/schemas/Timestamp' }
        coolingOffEndsAt: { $ref: '#/components/schemas/Timestamp' }
        completedAt: { type: [string, 'null'], format: date-time }
        retainedCategories: { type: array, maxItems: 100, items: { type: string, maxLength: 80 } }
        safeError: { type: string, maxLength: 160 }
        version: { $ref: '#/components/schemas/Version' }
    PrivacyAction:
      type: object
      additionalProperties: false
      required: [action, reason, expectedVersion]
      properties:
        action: { type: string, enum: [verify, retry, expire, fail] }
        reason: { $ref: '#/components/schemas/Reason' }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    DeletionAction:
      type: object
      additionalProperties: false
      required: [action, reason, expectedVersion]
      properties:
        action: { type: string, enum: [verify, schedule, retry, fail, cancel] }
        reason: { $ref: '#/components/schemas/Reason' }
        expectedVersion: { $ref: '#/components/schemas/Version' }
    RetentionPolicy:
      type: object
      additionalProperties: false
