          { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TimelineEntry' } }
        version: { $ref: '#/components/schemas/Version' }
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [id, eventType, detailsRedacted, occurredAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        eventType: { type: string, minLength: 1, maxLength: 80 }
        detailsRedacted: { type: string, minLength: 1, maxLength: 1000 }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorType, action, resourceType, requestId, occurredAt, safeMetadata]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actor: { $ref: '#/components/schemas/SafeReference' }
        actorType: { type: string, enum: [user, admin, system, provider] }
        action: { type: string, minLength: 1, maxLength: 100 }
        resourceType: { type: string, minLength: 1, maxLength: 80 }
        resourceId: { type: [string, 'null'], maxLength: 128 }
        result: { type: string, enum: [success, failure, blocked] }
        requestId: { type: string, minLength: 1, maxLength: 128 }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        safeMetadata:
          { type: array, maxItems: 40, items: { $ref: '#/components/schemas/SafeField' } }
    SafeReference:
      type: object
      additionalProperties: false
      required: [id, kind, label]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 160 }
    PrivacyExportCreate:
      type: object
      additionalProperties: false
      properties:
        scope:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            uniqueItems: true,
            items: { type: string, pattern: '^[a-z][a-z0-9._-]{1,79}$' },
          }
    PrivacyExport:
      type: object
      additionalProperties: false
      required: [id, status, requestedAt, expiresAt, version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ExportStatus' }
        scope:
          { type: array, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 80 } }
        requestedAt: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { type: [string, 'null'], format: date-time }
        basename: { type: string, pattern: '^[A-Za-z0-9._-]+\.zip$' }
        mediaType: { type: string, const: application/zip }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        checksumLabel: { type: string, maxLength: 80 }
        downloadUrl: { type: string, format: uri, writeOnly: false }
        downloadUrlExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        safeError: { type: string, maxLength: 160 }
        version: { $ref: '#/components/schemas/Version' }
    DeletionCreate:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation: { type: string, const: DELETE_MY_ACCOUNT }
        reason: { type: string, maxLength: 500 }
    DeletionRequest:
      type: object
      additionalProperties: false
