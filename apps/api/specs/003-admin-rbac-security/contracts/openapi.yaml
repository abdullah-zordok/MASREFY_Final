        retentionDays: { type: integer, minimum: 0 }
        deletionMode: { type: string, enum: [delete, anonymize, archive] }
        legalBasis: { type: string, minLength: 1, maxLength: 500 }
        enabled: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
    RetentionUpdate:
      type: object
