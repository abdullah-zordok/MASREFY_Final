  responses:
    Unauthorized:
      {
        description: Missing or invalid Clerk session.,
        content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } },
      }
    Forbidden:
      {
        description: Active profile/Admin,
        exact permission,
        recent auth/MFA,
        ownership,
        or support grant is absent.,
        content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } },
      }
    NotFound:
      {
        description: No authorized resource is visible.,
        content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } },
      }
    Conflict:
      {
        description: Version,
        state,
        uniqueness,
        scope,
        idempotency,
        self-approval,
        or continuity conflict.,
        content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } },
      }
    Gone:
      {
        description: Resource or invitation/grant/export is expired or terminal.,
        content: { application/json: { schema: { $ref: '#/components/schemas/SafeError' } } },
      }
    RateLimited:
