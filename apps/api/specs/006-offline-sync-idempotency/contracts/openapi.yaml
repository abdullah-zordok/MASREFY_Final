openapi: 3.1.0
info:
  title: Masarifi Offline Sync API
  version: 0.6.0
  description: SPEC-BE-006 contract for authenticated device synchronization.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/sync/bootstrap:
    get:
      operationId: bootstrapSync
      tags: [Sync]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Domains'
      responses:
        '200':
          description: Owner-safe current snapshots and starting cursors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400': { $ref: '#/components/responses/SyncBadRequest' }
        '401': { $ref: '#/components/responses/SyncUnauthorized' }
        '413': { $ref: '#/components/responses/SyncPayloadTooLarge' }
  /api/v1/sync/delta:
    get:
      operationId: getSyncDelta
      tags: [Sync]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Domain'
        - name: cursor
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
          description: Opaque cursor previously issued by this API.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      responses:
        '200':
          description: Ordered immutable changes after the supplied cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeltaResponse'
        '400': { $ref: '#/components/responses/SyncBadRequest' }
        '401': { $ref: '#/components/responses/SyncUnauthorized' }
        '409':
          description: Cursor is invalid for the owner/domain or has expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
        '413': { $ref: '#/components/responses/SyncPayloadTooLarge' }
  /api/v1/sync/mutations:
    post:
      operationId: submitSyncMutations
      tags: [Sync]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationBatchRequest'
      responses:
        '200':
          description: Per-operation receipts; completed entries are replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationBatchResponse'
        '400': { $ref: '#/components/responses/SyncBadRequest' }
        '401': { $ref: '#/components/responses/SyncUnauthorized' }
        '409':
          description: Reused batch or operation id with a different request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
        '413': { $ref: '#/components/responses/SyncPayloadTooLarge' }
  /api/v1/sync/ack:
    post:
      operationId: acknowledgeSync
      tags: [Sync]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
      responses:
        '200':
          description: Monotonic persisted checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400': { $ref: '#/components/responses/SyncBadRequest' }
        '401': { $ref: '#/components/responses/SyncUnauthorized' }
        '409':
          description: Cursor is invalid or ahead of the server cursor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
  /api/v1/conflicts:
    get:
      operationId: listSyncConflicts
      tags: [Sync Conflicts]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, rejected], default: open }
        - name: after
          in: query
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Paginated owner conflict records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictListResponse'
        '400': { $ref: '#/components/responses/SyncBadRequest' }
        '401': { $ref: '#/components/responses/SyncUnauthorized' }
  /api/v1/conflicts/{conflictId}:
    get:
      operationId: getSyncConflict
      tags: [Sync Conflicts]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: conflictId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owner-visible immutable conflict detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictResponse' }
        '400': { $ref: '#/components/responses/SyncBadRequest' }
        '401': { $ref: '#/components/responses/SyncUnauthorized' }
        '404': { $ref: '#/components/responses/SyncNotFound' }
    patch:
      operationId: resolveSyncConflict
      tags: [Sync Conflicts]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: conflictId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Stable terminal conflict decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '400': { $ref: '#/components/responses/SyncBadRequest' }
        '401': { $ref: '#/components/responses/SyncUnauthorized' }
        '404': { $ref: '#/components/responses/SyncNotFound' }
        '409':
          description: Conflict is terminal with a different decision or stale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    Domain:
      name: domain
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Domain' }
    Domains:
      name: domains
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        maxItems: 3
        items: { $ref: '#/components/schemas/Domain' }
  responses:
    SyncBadRequest:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
    SyncUnauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
    SyncNotFound:
      description: Resource not found for this owner.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
    SyncPayloadTooLarge:
      description: Response/request exceeds the 512 KiB sync budget.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SyncErrorEnvelope' }
  schemas:
    Domain:
      type: string
      enum: [accounts, categories, transactions]
    BootstrapResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [domains]
          properties:
            domains:
              type: array
              items:
                type: object
                required: [domain, cursor, items]
                properties:
                  domain: { $ref: '#/components/schemas/Domain' }
                  cursor: { type: string }
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
        meta: { $ref: '#/components/schemas/Meta' }
    DeltaResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [domain, changes, nextCursor, hasMore]
          properties:
            domain: { $ref: '#/components/schemas/Domain' }
            changes:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/SyncChange' }
            nextCursor: { type: string }
            hasMore: { type: boolean }
        meta: { $ref: '#/components/schemas/Meta' }
    SyncChange:
      type: object
      required: [cursor, resourceId, resourceType, operation, version]
      properties:
        cursor: { type: string }
        resourceId: { type: string }
        resourceType: { type: string }
        operation: { type: string, enum: [upsert, delete] }
        version: { type: integer, minimum: 0 }
        snapshot: { type: object, additionalProperties: true }
        deletedAt: { type: [string, 'null'], format: date-time }
    MutationBatchRequest:
      type: object
      required: [mutations]
      properties:
        mutations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Mutation' }
    Mutation:
      type: object
      required: [operationId, domain, resourceType, schemaVersion, dependsOn, operation, payload]
      properties:
        operationId: { type: string, format: uuid }
        domain: { $ref: '#/components/schemas/Domain' }
        resourceType: { type: string, enum: [account, category, transaction] }
        schemaVersion: { type: integer, enum: [1] }
        dependsOn:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        operation: { type: string, enum: [create, update, archive, restore, delete] }
        resourceId: { type: string, maxLength: 128 }
        baseVersion: { type: integer, minimum: 0 }
        payload: { type: object, additionalProperties: true }
    MutationBatchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [receipts]
          properties:
            receipts:
              type: array
              minItems: 1
              maxItems: 100
              items: { $ref: '#/components/schemas/MutationReceipt' }
        meta: { $ref: '#/components/schemas/Meta' }
    MutationReceipt:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [received, processing, applied, conflict, rejected] }
        resourceId: { type: string }
        result: { type: object, additionalProperties: true }
        conflictId: { type: string, format: uuid }
        error: { $ref: '#/components/schemas/ErrorItem' }
    AckRequest:
      type: object
      required: [domain, cursor]
      properties:
        domain: { $ref: '#/components/schemas/Domain' }
        cursor: { type: string, minLength: 1, maxLength: 256 }
        lastMutationId: { type: string, format: uuid }
    AckResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [domain, cursor, acknowledgedAt]
          properties:
            domain: { $ref: '#/components/schemas/Domain' }
            cursor: { type: string }
            acknowledgedAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
    ConflictListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Conflict' }
            nextCursor: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/Meta' }
    ConflictResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Conflict' }
        meta: { $ref: '#/components/schemas/Meta' }
    Conflict:
      type: object
      required:
        [
          id,
          transactionId,
          clientMutationId,
          serverVersion,
          clientVersion,
          conflictFields,
          serverSnapshot,
          clientSnapshot,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        clientMutationId: { type: string, format: uuid }
        serverVersion: { type: integer, minimum: 0 }
        clientVersion: { type: integer, minimum: 0 }
        conflictFields: { type: array, items: { type: string } }
        serverSnapshot: { type: object, additionalProperties: true }
        clientSnapshot: { type: object, additionalProperties: true }
        status: { type: string, enum: [open, resolved, rejected] }
        resolution: { type: [string, 'null'], enum: [server, client, merged, duplicate, null] }
        resolvedAt: { type: [string, 'null'], format: date-time }
    ResolveConflictRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [server, client, merged, duplicate] }
        payload: { type: object, additionalProperties: true }
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
    SyncErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: '#/components/schemas/ErrorItem' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorItem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - AUTH_REQUIRED
            - NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_IN_PROGRESS
            - SYNC_CURSOR_INVALID
            - SYNC_CURSOR_EXPIRED
            - SYNC_CURSOR_AHEAD
            - SYNC_DOMAIN_UNSUPPORTED
            - SYNC_OPERATION_UNSUPPORTED
            - SYNC_CONFLICT
            - SYNC_CONFLICT_RESOLVED
            - SYNC_RETRY_EXHAUSTED
        message: { type: string }
        details: { type: object, additionalProperties: true }
