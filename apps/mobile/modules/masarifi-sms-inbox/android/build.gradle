plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.masarifi'
version = '1.0.0'

android {
  namespace 'com.masarifi.smsinbox'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.work:work-runtime-ktx:2.10.1'
  def notificationsVersion = new groovy.json.JsonSlurper().parse(file('../../../node_modules/expo-notifications/package.json')).version
  implementation(findProject(':expo-notifications') ?: "host.exp.exponent:expo.modules.notifications:${notificationsVersion}")
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20180813'
  testImplementation 'org.robolectric:robolectric:4.14.1'
  testImplementation 'androidx.work:work-testing:2.10.1'
}

