name: Voice Private Journal Preparation

on:
  workflow_dispatch:
  push:
    branches: [codex/voice-auto-save-restoration-2026-10-11]
    paths:
      - scripts/android-voice-qualification/**
      - .github/workflows/voice-private-journal-qualification.yml
      - apps/mobile/package-lock.json
      - apps/mobile/package.json
      - apps/mobile/scripts/dependency-security.test.cjs
  pull_request:
    paths:
      - scripts/android-voice-qualification/**
      - .github/workflows/voice-private-journal-qualification.yml
      - apps/mobile/package-lock.json
      - apps/mobile/package.json
      - apps/mobile/scripts/dependency-security.test.cjs

permissions:
  contents: read

jobs:
  synthetic-private-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and test the portable reader on synthetic stores
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/voice-private-reader-test.log") 2>&1
          build_dir=$(mktemp -d "$RUNNER_TEMP/voice-private-reader.XXXXXX")
          source_list="$build_dir/sources.list"
          if command -v rg >/dev/null 2>&1; then
            rg --files -0 scripts/android-voice-qualification/src scripts/android-voice-qualification/tests -g '*.java' > "$source_list"
          else
            find scripts/android-voice-qualification/src scripts/android-voice-qualification/tests -type f -name '*.java' -print0 > "$source_list"
          fi
          mapfile -d '' -t sources < "$source_list"
          test "${#sources[@]}" -gt 0
          sources+=(scripts/android-voice-qualification/android-rehearsal/journal/SyntheticRootResolver.java)
          sources+=(scripts/android-voice-qualification/android-rehearsal/journal/SyntheticFixtureMetadata.java)
          "$JAVA_HOME_17_X64/bin/javac" -encoding UTF-8 -d "$build_dir" "${sources[@]}"
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.VoiceStoreSnapshotTest > "$build_dir/platform-test.log" 2>&1 || { cat "$build_dir/platform-test.log"; exit 1; }
          cat "$build_dir/platform-test.log"
          "$JAVA_HOME_17_X64/bin/java" -Xmx96m -cp "$build_dir" com.masarifi.voicequalification.VoiceStoreSnapshotHeapTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.CommittedWalSnapshotTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.ExistingDatabaseKeyTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.LocalAdmissionCollectorTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.TrackingAdmissionClassifierTest
          python3 scripts/android-voice-qualification/admission/test_admission_gate.py
          python3 -O scripts/android-voice-qualification/admission/test_admission_gate.py
          python3 scripts/android-voice-qualification/admission/test_parse_probe.py
          python3 -O scripts/android-voice-qualification/admission/test_parse_probe.py
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.StrictJsonTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.SecureStoreKeyIndexTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.VoiceJournalClassifierTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.NativeSnapshotReaderTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.PrivateProbePolicyTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.PrivateProbeFailureTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.PrivateProbeProcessPolicyTest
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.PrivateProbeRootTest > "$build_dir/root-test.log" 2>&1 || { cat "$build_dir/root-test.log"; exit 1; }
          cat "$build_dir/root-test.log"
          if grep -q 'UNEXECUTED_ROOT_CASE' "$build_dir/root-test.log"; then exit 1; fi
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.PrivateReaderFailureTest
          python3 scripts/android-voice-qualification/tests/test-private-probe-receipt.py
          python3 scripts/android-voice-qualification/tests/test-probe-build.py
          python3 scripts/android-voice-qualification/tests/test-bootstrap-observations.py
          python3 scripts/android-voice-qualification/tests/test-disabled-upgrade.py
          python3 -O scripts/android-voice-qualification/tests/test-disabled-upgrade.py
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.SyntheticRootResolverTest > "$build_dir/synthetic-root-test.log" 2>&1 || { cat "$build_dir/synthetic-root-test.log"; exit 1; }
          cat "$build_dir/synthetic-root-test.log"
          if grep -q 'UNEXECUTED_ROOT_CASE' "$build_dir/synthetic-root-test.log"; then exit 1; fi
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.SyntheticFixtureMetadataTest
          python3 scripts/android-voice-qualification/tests/schema-fixtures.py --output "$build_dir/schema-fixtures" --classes "$build_dir" --java "$JAVA_HOME_17_X64/bin/java"
          "$JAVA_HOME_17_X64/bin/java" -cp "$build_dir" com.masarifi.voicequalification.VoiceStoreQualificationTest "$build_dir/schema-fixtures"
          python3 scripts/android-voice-qualification/tests/real-wal-fixtures.py --classes "$build_dir" --java "$JAVA_HOME_17_X64/bin/java"
          if grep -q 'UNEXECUTED_PLATFORM_CASE' "$build_dir/platform-test.log"; then
            echo 'Every Linux platform protection case must execute.' >&2
            exit 1
          fi
      - name: Retain the test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-private-reader-preparation-${{ github.sha }}
          path: ${{ runner.temp }}/voice-private-reader-test.log
          if-no-files-found: error
  encrypted-wal-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked mobile dependencies without scripts
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/voice-encrypted-wal-test.log"
      - name: Verify build dependency security and CommonJS compatibility
        working-directory: apps/mobile
        run: npm run test:dependency-security
      - name: Qualify committed WAL pages using the deployed SQLCipher source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/voice-encrypted-wal-test.log") 2>&1
          build_dir=$(mktemp -d "$RUNNER_TEMP/voice-encrypted-wal.XXXXXX")
          vendor_dir=apps/mobile/node_modules/expo-sqlite/vendor/sqlcipher
          echo "8fdf08e15777a45386fe4b2fc7604f125eb9ec57d0aaa8bde11ec8d8115ed915  $vendor_dir/sqlite3.c" | sha256sum -c -
          echo "3c6356d8cf67ed92522114559cdcba1b38b39eab05e9f5989c1758b8eacef5b9  $vendor_dir/sqlite3.h" | sha256sum -c -
          gcc -shared -fPIC -O2 -D_GNU_SOURCE -include stdint.h -DSQLITE_THREADSAFE=1 \
            -DSQLITE_ENABLE_BYTECODE_VTAB=1 -DSQLITE_TEMP_STORE=2 \
            -DSQLITE_ENABLE_SESSION=1 -DSQLITE_ENABLE_PREUPDATE_HOOK=1 \
            -DSQLITE_ENABLE_MATH_FUNCTIONS=1 -DSQLITE_ENABLE_FTS4=1 \
            -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_FTS5=1 \
            -DSQLITE_HAS_CODEC=1 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init \
            -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -DSQLCIPHER_CRYPTO_OPENSSL \
            "$vendor_dir/sqlite3.c" -lcrypto -ldl -lpthread -lm -o "$build_dir/libfixture-sqlcipher.so"
          find scripts/android-voice-qualification/src scripts/android-voice-qualification/tests -type f -name '*.java' -print0 > "$build_dir/sources.list"
          printf '%s\0' scripts/android-voice-qualification/android-rehearsal/journal/SyntheticRootResolver.java >> "$build_dir/sources.list"
          printf '%s\0' scripts/android-voice-qualification/android-rehearsal/journal/SyntheticFixtureMetadata.java >> "$build_dir/sources.list"
          mapfile -d '' -t sources < "$build_dir/sources.list"
          "$JAVA_HOME_17_X64/bin/javac" -encoding UTF-8 -d "$build_dir" "${sources[@]}"
          python3 scripts/android-voice-qualification/tests/real-wal-fixtures.py \
            --classes "$build_dir" --java "$JAVA_HOME_17_X64/bin/java" \
            --sqlcipher-library "$build_dir/libfixture-sqlcipher.so"
          native_flags=(
            -std=c11 -fPIC -O2 -fvisibility=hidden -D_GNU_SOURCE
            -include stdint.h -include unistd.h -include sys/mman.h -include errno.h
            -DSQLITE_THREADSAFE=1 -DSQLITE_TEMP_STORE=2
            -DSQLITE_ENABLE_BYTECODE_VTAB=1 -DSQLITE_ENABLE_SESSION=1 -DSQLITE_ENABLE_PREUPDATE_HOOK=1
            -DSQLITE_ENABLE_MATH_FUNCTIONS=1 -DSQLITE_ENABLE_FTS4=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_FTS5=1
            -DSQLITE_HAS_CODEC=1 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown
            -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_OS_OTHER=1 -DSQLITE_OMIT_LOAD_EXTENSION=1
            -DSQLITE_OMIT_DESERIALIZE=1 -DSQLCIPHER_OMIT_DEFAULT_LOGGING=1 -I "$vendor_dir"
          )
          gcc "${native_flags[@]}" -c "$vendor_dir/sqlite3.c" -o "$build_dir/native-cipher.o"
          for mode in production test; do
            wrapper_flags=()
            if [[ "$mode" == test ]]; then wrapper_flags=(-DVQS_TEST=1); fi
            gcc "${native_flags[@]}" -Wall -Wextra -Werror "${wrapper_flags[@]}" \
              -c scripts/android-voice-qualification/native/voice_memory_reader.c -o "$build_dir/native-wrapper-$mode.o"
            gcc -shared -Wl,-Bsymbolic "$build_dir/native-cipher.o" "$build_dir/native-wrapper-$mode.o" \
              -lcrypto -lpthread -lm -o "$build_dir/libvoice-ram-$mode.so"
          done
          python3 scripts/android-voice-qualification/tests/memory-vfs-fixtures.py \
            --reader-library "$build_dir/libvoice-ram-production.so" \
            --test-reader-library "$build_dir/libvoice-ram-test.so" \
            --sqlcipher-library "$build_dir/libfixture-sqlcipher.so" \
            --classes "$build_dir" --java "$JAVA_HOME_17_X64/bin/java"
          python3 scripts/android-voice-qualification/tests/native-schema-fixtures.py \
            --reader-library "$build_dir/libvoice-ram-production.so" \
            --sqlcipher-library "$build_dir/libfixture-sqlcipher.so" \
            --classes "$build_dir" --java "$JAVA_HOME_17_X64/bin/java" \
            --output "$build_dir/native-schema-fixtures"
          gcc "${native_flags[@]}" -Wall -Wextra -Werror \
            -I "$JAVA_HOME_17_X64/include" -I "$JAVA_HOME_17_X64/include/linux" \
            -c scripts/android-voice-qualification/native/voice_memory_jni.c -o "$build_dir/native-jni.o"
          gcc -shared -Wl,-Bsymbolic "$build_dir/native-cipher.o" "$build_dir/native-wrapper-production.o" "$build_dir/native-jni.o" \
            -lcrypto -lpthread -lm -o "$build_dir/libvoice-private-jni.so"
          python3 scripts/android-voice-qualification/tests/whole-store-fixtures.py \
            --output "$build_dir/whole-store-fixtures" --sqlcipher-library "$build_dir/libfixture-sqlcipher.so" \
            --jni-library "$build_dir/libvoice-private-jni.so" --classes "$build_dir" --java "$JAVA_HOME_17_X64/bin/java"
          echo "VQS_CIPHER_BUILD=$build_dir" >> "$GITHUB_ENV"
      - name: Retain the exact public synthetic Android input fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-whole-store-fixtures-${{ github.sha }}
          path: ${{ env.VQS_CIPHER_BUILD }}/whole-store-fixtures
          if-no-files-found: error
      - name: Retain encrypted fixture qualification log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-encrypted-wal-preparation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/voice-encrypted-wal-test.log
            ${{ runner.temp }}/voice-encrypted-wal.*/native-schema-fixtures/**
            ${{ runner.temp }}/voice-encrypted-wal.*/whole-store-fixtures/**
          if-no-files-found: error
  disposable-android-encrypted-journals:
    needs: encrypted-wal-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: apps/api/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: voice-whole-store-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/vqs-android-encrypted-input
      - name: Install checksum-pinned Android compilation source
        working-directory: apps/mobile
        run: npm ci --ignore-scripts
      - name: Exercise encrypted full-store diagnostic only on disposable Android15
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/vqs-android15-encrypted"
          mkdir "$fixture_root"
          exec > >(tee "$fixture_root/rehearsal.log") 2>&1
          export ANDROID_USER_HOME="$fixture_root/user"
          export ANDROID_AVD_HOME="$fixture_root/avd"
          export ANDROID_EMULATOR_HOME="$fixture_root/user"
          export ANDROID_ADB_SERVER_PORT=15040
          export ADB_SERVER_SOCKET=tcp:localhost:15040
          export JAVA_HOME="$JAVA_HOME_17_X64"
          mkdir "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$sdk_root"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          timeout 300 "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --channel=0 \
            emulator platform-tools 'system-images;android-35;default;x86_64' \
            'platforms;android-36' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.1.12297006' < /dev/null
          "$sdk_root/emulator/emulator" -accel-check
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://dl.google.com/dl/android/maven2/androidx/core/core/1.17.0/core-1.17.0.aar \
            --output "$fixture_root/core-1.17.0.aar"
          echo "e1bd22bbcf5cee3a992dedb7d2d3c3b31c9f761c01e56d00ea443c8aaa981182  $fixture_root/core-1.17.0.aar" | sha256sum -c -
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://repo.maven.apache.org/maven2/io/github/ronickg/openssl/3.3.2-1/openssl-3.3.2-1.aar \
            --output "$fixture_root/openssl-3.3.2-1.aar"
          echo "bdd7fdc6d5534b0c3d1d1b233de4c7a688086aa8b13dcee70699a178a89ee298  $fixture_root/openssl-3.3.2-1.aar" | sha256sum -c -
          python3 scripts/android-voice-qualification/android-rehearsal/build-native.py \
            --output "$fixture_root/native" --ndk "$sdk_root/ndk/27.1.12297006" --abi x86_64 \
            --openssl-aar "$fixture_root/openssl-3.3.2-1.aar" --vendor apps/mobile/node_modules/expo-sqlite/vendor/sqlcipher
          python3 scripts/android-voice-qualification/android-rehearsal/build-fixtures.py \
            --output "$fixture_root/build" --sdk "$sdk_root" --java "$JAVA_HOME" \
            --runtime-android-jar "$sdk_root/platforms/android-35/android.jar" \
            --core-aar "$fixture_root/core-1.17.0.aar" --journal-native "$fixture_root/native" \
            --journal-abi x86_64 --journal-fixtures "$RUNNER_TEMP/vqs-android-encrypted-input"
          python3 scripts/android-voice-qualification/android-probe/build-probe.py \
            --output "$fixture_root/offline-unsigned-real-target-probe" --sdk "$sdk_root" --java "$JAVA_HOME" \
            --runtime-android-jar "$sdk_root/platforms/android-35/android.jar" \
            --native "$fixture_root/native"
          "$sdk_root/cmdline-tools/latest/bin/avdmanager" create avd \
            -n vqs_disposable_android15 -k 'system-images;android-35;default;x86_64' \
            -d pixel_7 -p "$ANDROID_AVD_HOME/vqs_disposable_android15.avd" < /dev/null
          "$sdk_root/platform-tools/adb" -P 15040 --one-device VQS_DISPOSABLE_NO_USB_DEVICE start-server
          "$sdk_root/emulator/emulator" -avd vqs_disposable_android15 -port 5580 \
            -accel on -gpu swiftshader -no-window -no-snapshot -no-audio -no-boot-anim \
            -no-metrics -crash-report-mode disabled > "$fixture_root/emulator.log" 2>&1 &
          emulator_pid=$!
          trap '"$sdk_root/platform-tools/adb" -P 15040 -s emulator-5580 emu kill || true; wait "$emulator_pid" || true' EXIT
          booted=0
          for attempt in $(seq 1 180); do
            kill -0 "$emulator_pid" || { cat "$fixture_root/emulator.log"; exit 1; }
            if [[ $("$sdk_root/platform-tools/adb" -P 15040 -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          test "$booted" -eq 1 || { cat "$fixture_root/emulator.log"; exit 1; }
          python3 scripts/android-voice-qualification/android-rehearsal/test-bootstrap.py \
            --adb "$sdk_root/platform-tools/adb" --adb-port 15040 --serial emulator-5580 \
            --build "$fixture_root/build" --output "$fixture_root/runtime" --encrypted-journals
      - name: Retain compact disposable qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disposable-encrypted-android-receipts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vqs-android15-encrypted/runtime/runtime-receipt.json
            ${{ runner.temp }}/vqs-android15-encrypted/runtime/runtime.log
            ${{ runner.temp }}/vqs-android15-encrypted/build/build-receipt.json
          if-no-files-found: error
      - name: Retain complete disposable encrypted Android qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disposable-encrypted-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vqs-android15-encrypted
            ${{ runner.temp }}/vqs-android-encrypted-input
          if-no-files-found: error
